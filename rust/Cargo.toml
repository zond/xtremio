[package]
name = "xtremio_core"
version = "0.1.0"
edition = "2021"
# What the dependency graph needs, checked with `cargo +1.97.1 check --locked
# --all-targets`: reedsolomon-rs (stream-server -> unrar-rs) declares 1.97.1, the
# highest in the lock. The 1.88 this said before was refused outright, with
# five dependencies naming newer compilers. Bump it with the pins.
rust-version = "1.97.1"
publish = false

[lib]
name = "xtremio_core"
# rlib is needed so tests/ can link the crate; cargokit ships the cdylib.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Codegen, Dart package and Rust crate must all be exactly this version
# (FRB enforces it at RustLib.init via forceSameCodegenVersion).
flutter_rust_bridge = "=2.13.0"

# Pure-Rust torrent/archive streaming server, embedded in-process (package
# `server`, lib `stream_server`). Pinned to a rev for reproducibility. Default
# features are ON, which links unrar-rs (GPL-3.0-or-later) -- see README.
# Build with `default-features = false` for an MIT binary without RAR support.
#
# The server keeps no record of what is pinned; it is told, every launch:
# `ServerConfig::pins`, handed in before its launch sweep runs, from this
# app's downloads registry -- the list the user sees and acts on. `None` there means "nobody told me" and keeps every
# torrent's data; an empty map means "nothing is pinned" and deletes it, so
# `crate::downloads::pins` is careful about which it answers.
#
# It also carries the retention redesign that arrived with it: one owner per
# entity on both the torrent and proxy sides, a window bounded by the budget
# with the fetch-ahead bounded by the window, liveness that ends on a switch
# or a restart rather than on a clock, and no cache cleaner at all -- every
# byte under the root has exactly one thing that deletes it.
stream-server = { package = "server", git = "https://github.com/zond/stream-server", rev = "2eebbfb23a46b4f018a77fa81e5b6097fa73a420" }

# `ServerHandle::dht_status` answers `enginefs::backend::DhtStatus`, which
# `stream-server` does not re-export (unlike `CacheUsage`/`EngineStats`), so
# it is named directly here -- same git pin as stream-server, so nothing
# extra is compiled: it is already in the graph as stream-server's own
# dependency.
enginefs = { git = "https://github.com/zond/stream-server", rev = "2eebbfb23a46b4f018a77fa81e5b6097fa73a420" }

# The official Stremio engine (addons, catalogs, library, player state).
# `derive` exports #[derive(Model)]; `env-future-send` makes EnvFuture Send so
# the Runtime can live on a multithreaded host.
#
# Pinned to our fork's `pinned` branch: upstream 0.62.1 plus one commit
# that keeps the addon-specific properties of a subtitle (`fpsMilli`,
# `subtitleFileName`, `releaseGroup`, ...) in a flattened `other` map
# instead of letting serde drop them, which is what lets the app name and
# frame-rate-filter the thirty-odd files OpenSubtitles answers with
# (upstream PR Stremio/stremio-core#1045, from the fork's
# subtitles-preserve-addon-fields branch) -- and one more that pins its
# `localsearch` dependency by rev rather than `branch = "main"`, which
# stays on `pinned` so the PR carries only its own change.
stremio-core = { git = "https://github.com/zond/stremio-core", rev = "b4c92f33c68bf73b9abb13b7503b1a529454c228", features = ["derive", "env-future-send"] }

anyhow = "1"
chrono = "0.4"
futures = "0.3"
http = "1"
# rustls with the aws-lc-rs provider; no system TLS. `rustls` is the only
# public feature that gives reqwest 0.13 a TLS backend at all, and it also
# pulls `rustls-platform-verifier`, which reqwest constructs for any client
# that brings no roots of its own. Our client brings them
# (`env::http_client_builder`: `tls_certs_only` with the roots below), so
# the platform verifier stays compiled -- stream-server's own reqwest
# clients still use it -- but is never constructed for the app's own
# traffic. On Android it was 91% of the Java heap; see `env.rs`.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "charset", "gzip"] }
# Mozilla's root program as full DER certificates: generated from the same
# CCADB report as `webpki-roots` (already in the graph via stream-server)
# and released in step with it, but in the form `reqwest::Certificate::
# from_der` takes; `webpki-roots` ships trust anchors, which reqwest 0.13
# has no builder method for.
webpki-root-certs = "1"
# Same matcher the server uses for a stream's `fileMustInclude` filters, so
# a download picks the file the media route would play. Already in the graph
# (tracing-subscriber's env-filter, stream-server), nothing new is compiled.
regex = "1"
# Free space and total space of the volume the server writes to
# (`src/storage.rs`), for the "is the device full" line of a diagnostics
# report. Already in the graph through the server's own enginefs, so
# nothing new is compiled.
fs4 = "1.1.0"
serde = { version = "1", features = ["derive"] }
# Digests the addon transport URL that keys the health record, so the URL --
# which can carry a debrid API key -- is never written down. Already in the
# graph (stream-server's tree pulls it), so nothing new is compiled.
sha2 = "0.11"
serde_json = "1"
# Names the failing JSON path when an addon response does not match the schema.
serde_path_to_error = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
url = "2"
# `log` feature: on Android no tracing subscriber is installed and events flow
# through the `log` crate into FRB's android_logger instead.
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# `logging::init` caps the `log` crate's process-wide level at our filter's:
# FRB opens it at TRACE, and rustls, mio and notify log through `log`, not
# `tracing`. The Android ring layer also re-emits every line through it so
# logcat keeps working once a tracing subscriber is installed. On every
# platform so the cap has a desktop test. Already in the graph via tracing's
# `log` feature, so nothing new is compiled.
log = "0.4"

# The process allocator (`src/lib.rs`), on every target the app builds for
# except wasm, where the crate has no allocator to replace. The same crate
# and the same features as the standalone stream-server binary
# (`server/src/main.rs`: `default-features = false`, no `secure`, no
# `override`), plus `local_dynamic_tls`: that binary owns its process, and
# this crate is a shared library Dart `dlopen`s, which is the case mimalloc
# documents `-ftls-model=local-dynamic` for -- initial-exec TLS in a
# library loaded after start-up is a "cannot allocate memory in static TLS
# block" waiting on a loader with no surplus left. Purging is not a Cargo
# feature: mimalloc returns freed pages to the OS on its own
# (`MIMALLOC_PURGE_DELAY`, 10 ms by default); tuning that at run time is
# `mi_option_set` behind the `extended` feature, which nothing here needs
# yet. Already in the graph through stream-server, so nothing new is
# compiled.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
mimalloc = { version = "0.1.52", default-features = false, features = ["local_dynamic_tls"] }

# JNI hook that hands the Android app Context to rustls-platform-verifier
# (src/android.rs). The app's own client no longer uses that verifier (see
# `reqwest` above); the embedded stream-server's clients still do, and
# without the init every HTTPS request they make on Android fails.
# Same versions stream-server uses, so nothing new enters the graph.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
rustls-platform-verifier = "0.7"

# aws-lc-sys (rustls' crypto provider) only ships pregenerated bindings for
# aarch64-linux-android; the emulator (x86_64) and armv7 builds must generate
# them at build time, which needs libclang on the host. Desktop and arm64
# builds are untouched.
[target.'cfg(all(target_os = "android", not(target_arch = "aarch64")))'.dependencies]
aws-lc-sys = { version = "0.45", features = ["bindgen"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tempfile = "3"
# Gzips one test body for `env::tests`, the shape of an addon answer that is
# small on the wire and enormous inflated. Already in the graph (the vendored
# stremio-watched-bitfield and stream-server's tree both pull it), so
# nothing new is compiled.
flate2 = "1"
# Real .torrent fixtures for tests/downloads.rs (`librqbit::create_torrent`),
# so the offline-downloads test needs no network and no peer. Pinned by rev
# on zond/rqbit, and always the rev the stream-server pin above uses for
# its enginefs: a different one puts two librqbits in the graph, the crate
# compiled twice. Bump the two together.
librqbit = { git = "https://github.com/zond/rqbit", rev = "7432b10eef7595c11c6f4b0288a308515840ecc2", default-features = false, features = [
    "rust-tls",
    "http-api-client",
] }

# REQUIRED: stremio-core's workspace member stremio-watched-bitfield pins
# `flate2 = "1.0.*"` (< 1.1) while stream-server's tree (zip, async-compression
# via async_zip/librqbit) needs flate2 >= 1.1. Cargo cannot pick two 1.x
# versions, so the graph does not resolve without relaxing that pin. See
# vendor/README.md for how to drop this once upstream relaxes it.
# The key is the source URL being patched, so it follows the dependency to
# the fork above -- left on the upstream URL it matches nothing, silently
# unpatching stremio-watched-bitfield and bringing the flate2 conflict back.
[patch."https://github.com/zond/stremio-core"]
stremio-watched-bitfield = { path = "vendor/stremio-watched-bitfield" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
# Keep unwinding so panics can be caught at the FFI boundary instead of
# aborting the host app.
panic = "unwind"

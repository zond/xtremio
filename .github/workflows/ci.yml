name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nothing here writes to the repository: it checks out, builds and tests.
# Said explicitly so the token every step can reach is a read-only one,
# whatever the repository's default is.
permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.1
  FRB_VERSION: 2.13.0

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - run: cargo fmt --check
        working-directory: rust

      - run: cargo clippy --all-targets -- -D warnings
        working-directory: rust

      - run: cargo test
        working-directory: rust

  # The core for the 32-bit Android userspace a Chromecast with Google TV
  # has (`make apk-tv`). The job above compiles for a 64-bit host only, where
  # `off_t`, `usize` and `c_long` are all 64 bits, so a length or offset
  # squeezed into one of them builds there and breaks on armv7, and nothing
  # else that runs per push compiles for armv7 (build.yml does, weekly). A
  # check, not a build: the type errors are what this is for, and linking an
  # APK is build.yml's job.
  #
  # The environment is what cargokit exports for the same target when Gradle
  # builds it (rust_builder/cargokit/build_tool/lib/src/android_environment.dart),
  # from the NDK the runner image ships. armv7 has no pregenerated aws-lc-sys
  # bindings, so bindgen runs, which wants libclang on the host and the NDK
  # sysroot for its headers (ANDROID.md, "Prerequisites"), and the cc builder
  # rather than CMake, as rust/cargokit.yaml forces for the app build.
  rust-armv7-android:
    name: Rust (check, armv7-linux-androideabi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Point the target at the NDK's clang
        run: |
          toolchain="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          # minSdk 24, as the app's Gradle build targets.
          clang="$toolchain/bin/armv7a-linux-androideabi24-clang"
          test -x "$clang"
          {
            echo "CC_armv7_linux_androideabi=$clang"
            echo "CXX_armv7_linux_androideabi=$clang++"
            echo "AR_armv7_linux_androideabi=$toolchain/bin/llvm-ar"
            echo "RANLIB_armv7_linux_androideabi=$toolchain/bin/llvm-ranlib"
            echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$clang"
            echo "BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi=--target=armv7a-linux-androideabi24 --sysroot=$toolchain/sysroot"
            echo "AWS_LC_SYS_CMAKE_BUILDER=0"
          } >> "$GITHUB_ENV"

      - run: cargo check --target armv7-linux-androideabi
        working-directory: rust

  flutter:
    name: Flutter (format, analyze, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - run: flutter pub get

      - run: dart format --set-exit-if-changed .

      - run: flutter analyze

      # FFI-backed tests load the host-built library from rust/target/debug
      # (see test/support/rust_lib.dart); cargokit only builds it for
      # `flutter run`/`flutter build`.
      - run: cargo build --manifest-path rust/Cargo.toml

      - run: flutter test

  codegen:
    name: flutter_rust_bridge codegen drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # A release tag, not `main`: the action runs with this job's token and
      # installs binaries the next steps execute, so what it is has to be
      # something a person chose, not whatever was pushed to a branch last.
      - uses: cargo-bins/cargo-binstall@v1.23.0

      # Codegen, Dart package and Rust crate must be the same FRB version.
      # `generate` shells out to `cargo expand`, so install that too.
      - run: cargo binstall -y flutter_rust_bridge_codegen@${{ env.FRB_VERSION }} cargo-expand

      - run: flutter pub get

      - run: flutter_rust_bridge_codegen generate

      - name: Generated bindings must be committed
        run: git diff --exit-code -- lib/src/rust rust/src/frb_generated.rs

  # Native platform builds (flutter build linux / apk, Rust cross-compiled
  # through cargokit + the NDK) are not gated yet; add them once the core
  # vertical slice is stable.

# Builds the app for every platform the README calls supported, and puts the
# results somewhere a person can download them.
#
# Deliberately not `ci.yml`. That one runs on every push and is the feedback
# anybody actually reads; this one cross-compiles Rust with `lto = true` and
# `codegen-units = 1` six times over, and hanging that off every push would
# make the fast checks useless without making these any more informative.
#
# Nothing here is allowed to fail softly. Windows and macOS have never been
# built by anyone -- there is no Mac in the project and nobody has tried
# Windows -- so a red job here is the answer to a question the README has so
# far only asserted, and `continue-on-error` would throw that answer away.
name: Build

on:
  # A version tag is a release: these artifacts become its downloads.
  push:
    tags: ['v*']
  # Someone asking, usually because they changed something native.
  workflow_dispatch:
  # Weekly, so rot in a toolchain, an SDK or a pod is found in a quiet week
  # rather than on the morning of a release.
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.1

# A newer dispatch supersedes an older one on the same ref, but a tag build is
# never cancelled: it is the one whose artifacts a Release is made of.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  android:
    name: Android ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      # One ABI failing must not cancel the other: which of the two broke is
      # the whole information this job carries.
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: apk
            # aws-lc-sys ships pregenerated bindings for aarch64-linux-android.
            libclang: false
          - abi: armeabi-v7a
            target: apk-tv
            # ...and for nothing else, so armv7 generates them at build time
            # and needs libclang on the host (ANDROID.md, "Prerequisites").
            libclang: true
    steps:
      - uses: actions/checkout@v7

      - if: matrix.libclang
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: dtolnay/rust-toolchain@stable
        with:
          # cargokit adds these itself on first build; pre-adding keeps that
          # first Gradle run from stopping to fetch a target mid-build.
          targets: aarch64-linux-android, armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          # cargokit does not build into `rust/target`: it passes
          # `--target-dir` pointing at the Gradle plugin's build directory, so
          # without this the only thing cached is the registry and every ABI
          # recompiles the whole graph from scratch.
          cache-directories: build/xtremio_core/build
          # A failed job's artifacts are worth keeping while this is being
          # got working: the next attempt should not pay for the last one's
          # failure by recompiling everything before reaching it.
          cache-on-failure: true

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - run: make ${{ matrix.target }}

      # These are signed with the Flutter template's debug key -- see the
      # release notes below. Say so in the name, because the name is all a
      # person downloading it sees.
      - name: Name the APK after the build it is
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             "xtremio-${{ matrix.abi }}-debug-key.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: xtremio-${{ matrix.abi }}-debug-key
          path: xtremio-${{ matrix.abi }}-debug-key.apk
          if-no-files-found: error

  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # media_kit links libmpv; the rest is what `flutter build linux` wants.
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          cache-directories: build/linux/x64/release/plugins/xtremio_core/cargokit_build
          cache-on-failure: true

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - run: make linux

      # A bundle is a directory of a binary, its libraries and its assets, and
      # it has to arrive as one: uploading the tree loose loses the executable
      # bit, which leaves a download that cannot be started.
      - run: tar -czf xtremio-linux-x64.tar.gz -C build/linux/x64/release bundle

      - uses: actions/upload-artifact@v7
        with:
          name: xtremio-linux-x64
          path: xtremio-linux-x64.tar.gz
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      # Before the checkout, because it decides what the checkout writes.
      # Git for Windows ships core.autocrlf=true and this repository has no
      # .gitattributes, so every text file lands with CRLF -- whereupon
      # `flutter pub get` finds the seven generated plugin registrants
      # (Linux's and macOS's as well as this platform's) different from what
      # it renders, rewrites them all with LF, and git reports them modified
      # for the rest of the job. The build then gets stamped `<commit>-dirty`
      # off a tree nobody touched, which is a report calling itself something
      # it is not. Check out the bytes that are in the repository and none of
      # it happens. (The repository-wide answer is a .gitattributes; that is
      # a decision about everyone's checkout, not just this runner's.)
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      # aws-lc-sys assembles its x86_64 primitives with NASM, which the
      # Windows image does not ship.
      - uses: ilammy/setup-nasm@v1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          cache-directories: build/windows/x64/plugins/xtremio_core/cargokit_build
          cache-on-failure: true

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      # The Makefile's job, spelled out: this runner has no make, and a build
      # without the two defines reports `app: unknown` in Diagnostics.
      #
      # `permission_handler_windows` -- pulled in transitively by
      # flutter_chrome_cast, and unreachable on this platform -- includes
      # <experimental/coroutine>, which the MSVC 14.51 STL on the current
      # image answers with a static assertion rather than a warning (C2338,
      # STL1011). The macro is the escape hatch that error names, and there
      # is no version of the plugin without the include: 0.2.2 is the newest,
      # and `permission_handler` 13 still depends on ^0.2.2. When Microsoft
      # finally removes the header, as that error promises, this stops
      # working and the plugin has to be fixed upstream.
      #
      # CXXFLAGS, which CMake reads into CMAKE_CXX_FLAGS for the whole
      # project, rather than cl.exe's own `CL`: this step runs under Git
      # Bash, whose MSYS runtime rewrites an environment value that starts
      # with `/` into a Windows path on the way to a native process, so a
      # `/D...` there arrives as a directory name and CMake stops being able
      # to find a C++ compiler at all. `-D` for the same reason.
      - name: flutter build windows, stamped the way the Makefile stamps
        shell: bash
        env:
          CXXFLAGS: -D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: |
          # Git for Windows checks out CRLF and `$( )` strips the trailing
          # newline but not the CR, so without `tr` the version define carries
          # one into the Diagnostics header. `-dirty` is the Makefile's rule
          # (its comment says why) and means the same thing here: a report
          # must not name a commit it was not built from, and the only reason
          # this is spelled out twice is that the runner has no make.
          version=$(sed -n 's/^version: //p' pubspec.yaml | tr -d '\r')
          commit=$(git rev-parse --short HEAD | tr -d '\r')
          dirt=$(git status --porcelain)
          if [ -n "$dirt" ]; then
            commit="$commit-dirty"
            echo "Not building from a clean tree, so the stamp says so:"
            echo "$dirt"
          fi
          # What `make version` prints, for the same reason: every other job
          # gets its stamp echoed by make, and this one is the build nobody
          # can go and look at the tree of afterwards.
          echo "XTREMIO_VERSION=$version XTREMIO_GIT_COMMIT=$commit"
          flutter build windows --release \
            --dart-define=XTREMIO_VERSION="$version" \
            --dart-define=XTREMIO_GIT_COMMIT="$commit"

      - name: Archive the release directory
        shell: bash
        run: |
          cd build/windows/x64/runner
          7z a -tzip ../../../../xtremio-windows-x64.zip Release

      - uses: actions/upload-artifact@v7
        with:
          name: xtremio-windows-x64
          path: xtremio-windows-x64.zip
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Which of the two Xcode asks cargokit for depends on the archs the
          # Flutter build settles on, so have both.
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          # Xcode's TARGET_TEMP_DIR for the plugin's pod, which is what
          # cargokit's build_pod.sh hands cargo as `--target-dir`.
          cache-directories: build/macos/Build/Intermediates.noindex/Pods.build/Release/xtremio_core.build
          cache-on-failure: true

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - run: make macos

      # `ditto` rather than `zip`: an .app is symlinks and resource forks, and
      # a plain zip flattens enough of that to produce a bundle that will not
      # launch.
      - run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/xtremio.app xtremio-macos.zip

      - uses: actions/upload-artifact@v7
        with:
          name: xtremio-macos
          path: xtremio-macos.zip
          if-no-files-found: error

  ios:
    name: iOS (compile only)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          cache-directories: build/ios/Build/Intermediates.noindex/Pods.build/Release-iphoneos/xtremio_core.build
          cache-on-failure: true

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      # No artifact: there is no signing identity, so nothing this produces
      # can be installed. The answer it gives is whether it compiles at all.
      #
      # `--verbose` permanently, because without it this job cannot answer
      # that. Flutter meets any failed device build with its "requires a
      # selected Development Team with a Provisioning Profile" advice --
      # `--no-codesign` leaves DEVELOPMENT_TEAM unset, so that text appears
      # whatever went wrong -- and swallows the xcodebuild output that says
      # what did. A job whose whole output is a misdiagnosis is worse than no
      # job. The logs are long; the answer is in them.
      - run: make ios FLAGS=--verbose

      # ...and the misdiagnosis is still printed last, where a person opening
      # a red job reads it first. Say so in the log rather than in a comment
      # in this file, which is not what they have open.
      - name: What that failure actually means
        if: failure()
        run: |
          echo 'Ignore the "Development Team / Provisioning Profile" advice'
          echo 'above: --no-codesign makes Flutter print it for every failed'
          echo 'device build. Search the log for "BuildTool failed" and for'
          echo '"error[" to find the real one.'
          echo
          echo 'Known blocker as of 2026-09-05, upstream and unfixed here:'
          echo '  librqbit-dualstack-sockets 0.7.0, src/bind_device.rs:54'
          echo '  error[E0599]: no method named `bind_device` found for'
          echo '  reference `&Socket`'
          echo 'It gates the socket2 call on `not(any(macos, windows))`, but'
          echo 'socket2 only offers bind_device on Linux, Android and Fuchsia;'
          echo 'the Apple platforms get bind_device_by_index_v4/v6, which the'
          echo 'crate already uses -- for macOS alone. Fixing it means'
          echo 'widening that branch to iOS upstream.'

  release:
    name: GitHub Release
    if: github.ref_type == 'tag'
    # Not `ios`. That job produces no artifact -- the notes below say iOS is
    # deliberately not shipped -- and it is red on an upstream crate nobody
    # here can fix, so gating on it means a tag builds four good downloads
    # and publishes none of them, which is the whole point of this file
    # undone. Dropping it from `needs` leaves the job exactly as red and
    # exactly as visible; it just stops it holding the door.
    needs: [android, linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'NOTES'
          ## Downloads

          | File | For |
          |---|---|
          | `xtremio-arm64-v8a-debug-key.apk` | Android phones and 64-bit TV boxes |
          | `xtremio-armeabi-v7a-debug-key.apk` | Chromecast with Google TV and other 32-bit Android TV boxes |
          | `xtremio-linux-x64.tar.gz` | Linux desktop (needs `libmpv`) |
          | `xtremio-windows-x64.zip` | Windows desktop |
          | `xtremio-macos.zip` | macOS, Intel and Apple silicon (unsigned -- see below) |

          iOS is built in CI to prove it compiles, but not shipped: there is no
          signing identity here, and App Store terms are incompatible with the
          GPL-3 the compiled binary carries.

          ## The macOS build is unsigned, and Sequoia changed how you get past that

          There is no Developer ID here, so macOS quarantines the download and
          refuses to open it. Control-clicking and choosing Open **is no longer
          a way round it**: macOS 15 Sequoia removed that override. Instead,
          try to open the app once and let it be refused, then go to System
          Settings > Privacy & Security, where an "Open Anyway" button now
          appears for it.

          Or clear the quarantine flag yourself before opening it:

          ```
          xattr -dr com.apple.quarantine /Applications/xtremio.app
          ```

          ## The APKs are test builds, signed with a throwaway key

          Both APKs are signed with the Flutter template's **debug key**, which
          is public and identical on every machine. They install and run, but
          they are test builds and nothing about that signature identifies
          them as ours.

          **This has a consequence worth knowing before you install.** Android
          refuses to replace an app with one signed by a different key. When a
          real keystore eventually replaces this one, upgrading in place will
          fail with `INSTALL_FAILED_UPDATE_INCOMPATIBLE`, and everybody running
          one of these builds will have to uninstall -- losing local library,
          settings and downloads -- before the signed build will install. That
          is a decision deferred, not one avoided.
          NOTES
          # Draft, upload, publish -- three steps because `gh release create`
          # with the files on the end is not one. It creates the release
          # first and then uploads the assets one at a time, so a single
          # failed upload (the macOS zip is 70 MB) leaves a *public* release
          # missing half its downloads, and the obvious retry dies at
          # `create` with `already_exists` without ever attaching the rest.
          # A plain "re-run all jobs" on a tag that already released fails
          # the same way, at a step that has nothing to do with any build.
          #
          # This way nothing is visible until every file is attached, and
          # running the job again lands in the same place instead of failing.
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft \
              --title "$GITHUB_REF_NAME" \
              --notes-file notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" artifacts/*/* --clobber
          gh release edit "$GITHUB_REF_NAME" \
            --draft=false --notes-file notes.md

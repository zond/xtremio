include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

    - rust_builder/cargokit/**
    # Vendored packages, kept as their authors wrote them (PATCHES.md).
    - third_party/**
linter:
  rules:
    # `comment_references` stays off: the doc comments here point across
    # features on purpose (`[SharingScope]` from the shell, `[RemotePress]`
    # from an addon tile), and a class comment points at the private members
    # of the State beside it. Enabling the rule would mean importing a
    # library for the sake of a comment, or unlinking the reference -- and
    # unlinking is what would make real rot invisible. It flagged 49
    # references the last time it was run; re-run it (add the rule here, run
    # `flutter analyze`) and read what it names before trusting that number.

<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Choose what to play</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { margin: 0; display: grid; place-items: center; min-height: 100svh;
         padding: 24px; box-sizing: border-box; }
  main { max-width: 32rem; text-align: center; }
  h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
  p { line-height: 1.5; opacity: .8; }
  button, a.button { display: inline-block; margin-top: 1.5rem;
           padding: .9rem 1.6rem; border: 0; border-radius: 999px;
           background: #1a73e8; color: white; text-decoration: none;
           font-weight: 600; font-size: 1rem; }
  .bad { color: #c5221f; }
  .done { color: #188038; font-weight: 600; }
</style>
<main>
  <h1 id="head">Choose what to play</h1>
  <p id="what">Loading…</p>
  <button id="go" hidden>Choose files</button>
  <a class="button" id="back" hidden>Back to Xtremio</a>
</main>
<script src="https://apis.google.com/js/api.js"></script>
<script>
  // Filled in at deploy: the browser key and the project number the Picker
  // needs. Neither is a secret -- the key is restricted to this site's
  // referrer, and the app id is the project number.
  const API_KEY = 'AIzaSyBwXLR-r5zTcnsON3foyE0_TvCEquHVenU';
  const APP_ID = '55893685423';

  const session = new URLSearchParams(location.search).get('s');
  const failed = new URLSearchParams(location.search).get('error');
  const what = document.getElementById('what');
  const head = document.getElementById('head');
  const go = document.getElementById('go');
  const back = document.getElementById('back');

  /**
   * Where to send this browser once the picking is done, or null.
   *
   * The service says which (`GET /session/<id>/token`), because the service
   * is what was told which shape asked for the pairing. Only a phone is sent
   * anywhere: the app put this browser here itself *and* the `stremio://`
   * registration ships with it there.
   */
  let backLink = null;

  /**
   * Which shape asked for this pairing: `tv`, `phone` or `desktop`.
   *
   * Three, and not the presence of [backLink], because the two shapes that
   * are sent nowhere are sent nowhere for opposite reasons and want opposite
   * things said to them. A television's viewer is not reading this page --
   * they are looking at the television, and the page's job is to say the
   * files went *there*. A desktop's viewer is reading this page, on the very
   * machine the app is running on, and the page's job is to say the pairing
   * landed and this window is finished with. While this was read off
   * `backLink` they were one case, and a desktop was told its files were on
   * the way to a television it has not got.
   *
   * Unknown is treated as a television, which is what the service sends for
   * anything it does not recognise.
   */
  let shape = 'tv';

  const say = (text, cls) => { what.className = cls || ''; what.textContent = text; };

  /** What the pairing is for, in the words the viewer would use for it. */
  const destination = () => shape === 'tv' ? 'your television' : 'Xtremio';

  /**
   * What is left for the viewer to do, when it is this page that has to say
   * it. Only the desktop: the phone is about to be taken back to the app and
   * the television's viewer is not reading this.
   */
  const afterword = () =>
      shape === 'desktop' ? ' You can close this window.' : '';

  async function start() {
    if (failed) return say(`Google said: ${failed}`, 'bad');
    if (!session) return say('This link is missing its code.', 'bad');
    let accessToken;
    try {
      const answer = await fetch(`/session/${session}/token`);
      const ready = await answer.json();
      if (!answer.ok) throw new Error(ready.error);
      accessToken = ready.accessToken;
      backLink = ready.handBack || null;
      shape = ready.shape || 'tv';
    } catch (e) {
      // Shape-agnostic on purpose: this is the one failure that happens
      // before the service has said which shape asked, so "scan again" would
      // be an instruction a desktop's viewer has no way to follow.
      return say(`${e.message}. Ask Xtremio for a fresh code.`, 'bad');
    }
    // What it says is what a phone can actually do. Promising several files
    // to somebody holding a device that cannot select two is worse than
    // saying nothing: they would hunt for a control that is not there.
    say('Signed in. Choose what you want to play — only what you choose is '
        + 'shared. On a phone that is one file at a time; on a computer, '
        + 'hold Ctrl (or Cmd) to choose several at once.');
    go.hidden = false;
    go.onclick = () => gapi.load('picker', () => picker(accessToken));
  }

  function picker(accessToken) {
    // Videos, and the viewer's own Drive. Folders are shown so they can be
    // walked into, and are **not selectable**.
    //
    // They were selectable while one question was open -- does picking a
    // folder grant what is inside it? -- and the answer, measured against
    // the real API rather than read in a doc, was **no**: a token that had
    // picked a folder could read the folder's own record and list nothing
    // in it. So a selectable folder is a control that hands the viewer a
    // grant worth nothing, and the question it existed to answer is shut.
    //
    // It is also the first suspect for the Picker refusing more than one
    // file despite MULTISELECT_ENABLED below, which is the reason this is
    // being taken out today rather than whenever.
    const view = new google.picker.DocsView(google.picker.ViewId.DOCS)
        .setIncludeFolders(true);

    // Multi-select is asked for and **will not be granted on a phone**.
    //
    // Not our bug and not a spelling mistake: the Picker gates selection on
    // `event.ctrlKey || event.metaKey`, so a device with no Ctrl key can
    // hold exactly one file. Reported by somebody else in April 2024,
    // confirmed by Google, still open and still `Status: New`
    // (issuetracker.google.com/issues/334994030). It is asked for anyway,
    // because the day it is fixed this page should already work and
    // everything behind it -- a pairing carrying a list, `linkFiles`,
    // `linkingAll` -- already does.
    //
    // The documented way round it, `trigger_onepick` on the authorisation
    // URL, was tried against this very client: Google accepted the parameter
    // and then failed at the consent step with `invalid_request`.
    new google.picker.PickerBuilder()
        .setAppId(APP_ID)
        .setOAuthToken(accessToken)
        .setDeveloperKey(API_KEY)
        .enableFeature(google.picker.Feature.MULTISELECT_ENABLED)
        .addView(view)
        .setCallback(chosen)
        .build()
        .setVisible(true);
  }

  /** What was sent: right for one file, and right for twenty. */
  function sent(files) {
    const subject = files.length === 1
        ? `“${files[0].name}”`
        : `${files.length} files`;
    const verb = files.length === 1 ? 'is' : 'are';
    return `${subject} ${verb} on the way to ${destination()}.${afterword()}`;
  }

  async function chosen(data) {
    if (data.action !== google.picker.Action.PICKED) return;
    // `docs` has always been an array; what is new is reading past the first
    // of it.
    const files = (data.docs || []).map((doc) => ({
      fileId: doc.id,
      name: doc.name,
      mimeType: doc.mimeType,
    }));
    if (files.length === 0) return;
    const answer = await fetch(`/session/${session}/files`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({files}),
    });
    if (!answer.ok) {
      return say(shape === 'tv'
          ? 'Your television did not take it.'
          : 'Xtremio did not take it. Try again from the app.', 'bad');
    }
    head.textContent = 'Sent';
    go.hidden = true;
    say(sent(files), 'done');
    handBack();
  }

  /**
   * Puts the viewer back in front of the app, when the app asked for it.
   *
   * The confirmation above is drawn first and the button is shown before
   * the navigation is attempted, so that a browser which refuses to follow
   * a custom scheme without a tap leaves a page that says what happened and
   * offers the tap -- rather than a page the viewer has to guess at. A
   * television's session has no `backLink`, and neither has a desktop's, so
   * nothing here fires for either -- what those two are told instead is in
   * `destination` and `afterword`.
   */
  function handBack() {
    if (!backLink) return;
    back.href = backLink;
    back.hidden = false;
    location.href = backLink;
  }

  start();
</script>

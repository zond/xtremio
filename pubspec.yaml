name: xtremio
description: "Xtremio — a native Stremio client on a pure-Rust core"
publish_to: 'none'

version: 0.1.11+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  xtremio_core:
    path: rust_builder
  flutter_rust_bridge: 2.13.0
  path_provider: ^2.1.6
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  url_launcher: ^6.3.2
  app_links: ^7.2.1
  crypto: ^3.0.6
  # The one allocation the forceful destroy needs: an argv for libmpv's
  # `mpv_command_async`, which is reached through media_kit's own handle.
  ffi: ^2.2.0
  flutter_chrome_cast: ^1.4.8
  # Where a Google Drive pairing's refresh token is kept. The one dependency
  # here that is a different store on every platform: on Android a
  # preferences file of AES-GCM ciphertext whose key is wrapped in the
  # Keystore, on macOS the Keychain, on Windows an encrypted file keyed from
  # the Credential Manager, and on Linux libsecret -- which means a keyring
  # daemon, and means nothing at all on a machine with none.
  # `lib/core/secret_store.dart` says what each one actually gets, and
  # `DriveAccount` what happens where there is none. A Linux build needs
  # `libsecret-1-dev` (docs/OPERATIONS.md).
  flutter_secure_storage: ^11.2.0
  # The QR a television draws for a Drive pairing. Pure Dart over `qr`, by
  # the same author: a CustomPainter and no platform channel, so a widget
  # test lays one out like anything else. A hand-rolled encoder was the
  # alternative and was not worth it -- Reed-Solomon, the mask scoring and
  # the version tables are a page of arithmetic whose failure mode is a code
  # that looks right on the panel and no camera reads, which is a bug found
  # in a living room rather than in this suite.
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # A clock the tests can wind: what shows that the downloads service takes
  # no listing on a timer over a minute of progress rows, in no time at all.
  # Already in the graph through flutter_test, so nothing new is fetched.
  fake_async: ^1.3.3

  flutter_lints: ^6.0.0

# The Android libmpv, built with every decoder rather than the whitelist
# media_kit publishes by default.
#
# That whitelist leaves out TrueHD and MLP: without this override, a Dolby
# TrueHD track -- the usual audio of a UHD Blu-ray remux -- plays as
# silence, with nothing at all on screen and "Failed to initialize a
# decoder for codec 'truehd'" in the log. The override is this package with
# four URLs changed: same libmpv, same ffmpeg, same NDK, same licence, and
# 3.4 MiB more per ABI (see `third_party/media_kit_libs_android_video`).
dependency_overrides:
  media_kit_libs_android_video:
    path: third_party/media_kit_libs_android_video

flutter:
  uses-material-design: true

  # The licences a compiled binary has to carry with it; see
  # lib/core/bundled_licenses.dart. unrar-rs asks that a binary
  # redistribution reproduce its licence file, so the file travels in the
  # build rather than only in the repository.
  assets:
    - LICENSE-GPL-3.0
    - LICENSE-unrar-rs
